<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AccessED Hub — WCAG AAA Adaptive Learning &amp; Bionic Reading Studio</title>
  <style>
    :root { --bg: #0b1120; --fg: #f8fafc; --card: #131d33; --border: #273759; --accent: #38bdf8; --muted: #94a3b8; }
    body.warm { --bg: #fefce8; --fg: #1c1917; --card: #fef9c3; --border: #ca8a04; --accent: #0369a1; --muted: #57534e; }
    body.contrast { --bg: #000000; --fg: #ffff00; --card: #111111; --border: #ffff00; --accent: #00ffff; --muted: #e5e5a3; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.75; transition: background 0.2s, color 0.2s; }
    body.dyslexic { letter-spacing: 0.065em; word-spacing: 0.16em; line-height: 2.05; font-size: 1.12rem; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.25rem; }
    h1 { margin: 0; font-size: 1.65rem; }
    .sub { color: var(--muted); font-size: 0.92rem; margin: 0.25rem 0 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.1rem; align-items: center; }
    button { background: var(--card); color: var(--fg); border: 1px solid var(--border); padding: 0.5rem 0.9rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    button.active, button.primary { background: var(--accent); color: #04101d; border-color: transparent; }
    .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1.2rem; }
    @media (max-width: 840px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.15rem; margin-bottom: 1.1rem; }
    .panel h2 { margin: 0 0 0.75rem; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }
    textarea { width: 100%; min-height: 175px; padding: 0.85rem; border-radius: 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); font: inherit; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 0.7rem; margin-bottom: 1.1rem; }
    .metric { background: var(--card); border: 1px solid var(--border); padding: 0.75rem 0.85rem; border-radius: 10px; }
    .metric .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .metric .val { font-size: 1.2rem; font-weight: 700; margin-top: 0.2rem; }
    .reader-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; min-height: 160px; }
    .step-item { padding: 0.45rem 0.65rem; border-left: 3px solid var(--accent); margin-bottom: 0.5rem; background: rgba(56,189,248,0.06); border-radius: 0 6px 6px 0; }
    .pill { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 999px; font-size: 0.76rem; font-weight: 700; background: rgba(56,189,248,0.18); color: var(--accent); }
    .ruler { position: fixed; left: 0; right: 0; height: 42px; background: rgba(56, 189, 248, 0.14); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); pointer-events: none; display: none; z-index: 99; }
  </style>
</head>
<body>
  <div class="ruler" id="ruler"></div>
  <div class="wrap">
    <header>
      <div>
        <h1>AccessED Hub</h1>
        <p class="sub">WCAG AAA Adaptive Learning Studio — Flesch-Kincaid Readability, Bionic Fixations, Plain-Language Chunking &amp; Web Speech TTS</p>
      </div>
      <span class="pill" id="wcagBadge">WCAG AAA</span>
    </header>

    <div class="toolbar">
      <button id="themeDark" class="active">Dark Slate</button>
      <button id="themeWarm">Warm Dyslexia Cream</button>
      <button id="themeContrast">Max Contrast (AAA)</button>
      <button id="dysBtn">Dyslexia Spacing</button>
      <button id="bionicBtn" class="active">Bionic Reading</button>
      <button id="rulerBtn">Focus Ruler</button>
      <button class="primary" id="speakBtn">Read Aloud (TTS)</button>
      <button id="stopBtn">Stop Audio</button>
      <label style="font-size:0.82rem;color:var(--muted)">Rate <input id="rate" type="range" min="0.6" max="1.4" step="0.05" value="0.92" style="vertical-align:middle" /></label>
    </div>

    <div class="metrics" id="metrics"></div>

    <div class="grid">
      <div class="panel">
        <h2>Source Study Material <button id="loadDense" style="padding:0.25rem 0.6rem;font-size:0.78rem">Load Dense Lecture Sample</button></h2>
        <textarea id="input">Students frequently encounter dense academic textbooks that utilize comprehensive methodology and complex terminology; consequently learners with dyslexia, ADHD, or visual fatigue struggle to facilitate rapid comprehension. AccessED Hub demonstrates how plain-language simplification, bionic fixation anchors, WCAG AAA contrast themes, and paced audio playback remove learning barriers immediately in any browser.</textarea>
        <div id="jargonBar" style="margin-top:0.7rem;font-size:0.85rem;color:var(--muted)"></div>
      </div>

      <div class="panel">
        <h2>Adaptive Accessible Reader <button id="exportStudy" style="padding:0.25rem 0.6rem;font-size:0.78rem">Export Study Guide (.md)</button></h2>
        <div class="reader-box" id="reader"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { analyzeReadability, simplifyText, toBionicHtml, computeWcagContrast } from "./access.mjs";

    const inp = document.getElementById("input");
    const reader = document.getElementById("reader");
    const ruler = document.getElementById("ruler");
    let bionicOn = true;
    let rulerOn = false;
    let currentTheme = { fg: "#f8fafc", bg: "#0b1120" };

    function setTheme(cls, fg, bg, activeId) {
      document.body.classList.remove("warm", "contrast");
      if (cls) document.body.classList.add(cls);
      currentTheme = { fg, bg };
      ["themeDark", "themeWarm", "themeContrast"].forEach(id => document.getElementById(id).classList.toggle("active", id === activeId));
      const wcag = computeWcagContrast(fg, bg);
      document.getElementById("wcagBadge").textContent = `${wcag.grade} (${wcag.ratio}:1)`;
    }

    function render() {
      const r = analyzeReadability(inp.value);
      const steps = simplifyText(inp.value);
      document.getElementById("metrics").innerHTML = `
        <div class="metric"><div class="lbl">FK Grade Level</div><div class="val">Grade ${r.fkGrade}</div></div>
        <div class="metric"><div class="lbl">Reading Ease</div><div class="val">${r.fleschEase} / 100</div></div>
        <div class="metric"><div class="lbl">Difficulty</div><div class="val" style="font-size:0.95rem">${r.level}</div></div>
        <div class="metric"><div class="lbl">Words / Time</div><div class="val">${r.wordCount} (${r.readingMinutes}m)</div></div>
        <div class="metric"><div class="lbl">3+ Syllable Words</div><div class="val">${r.longWords}</div></div>
      `;

      document.getElementById("jargonBar").innerHTML = r.jargonHits.length
        ? `<strong>Auto-Simplified Jargon:</strong> ` + r.jargonHits.map(j => `<span class="pill">${j.complex} → ${j.simple}</span>`).join(" ")
        : `<strong>Plain-Language Check:</strong> No heavy jargon detected.`;

      reader.innerHTML = steps.map((s, idx) =>
        `<div class="step-item"><strong>${idx + 1}.</strong> ${bionicOn ? toBionicHtml(s) : s}</div>`
      ).join("") || "<em>Enter study text on the left...</em>";
    }

    document.getElementById("themeDark").addEventListener("click", () => setTheme("", "#f8fafc", "#0b1120", "themeDark"));
    document.getElementById("themeWarm").addEventListener("click", () => setTheme("warm", "#1c1917", "#fefce8", "themeWarm"));
    document.getElementById("themeContrast").addEventListener("click", () => setTheme("contrast", "#ffff00", "#000000", "themeContrast"));
    document.getElementById("dysBtn").addEventListener("click", (e) => {
      document.body.classList.toggle("dyslexic");
      e.target.classList.toggle("active");
    });
    document.getElementById("bionicBtn").addEventListener("click", (e) => {
      bionicOn = !bionicOn;
      e.target.classList.toggle("active", bionicOn);
      render();
    });
    document.getElementById("rulerBtn").addEventListener("click", (e) => {
      rulerOn = !rulerOn;
      e.target.classList.toggle("active", rulerOn);
      ruler.style.display = rulerOn ? "block" : "none";
    });
    window.addEventListener("mousemove", (e) => {
      if (rulerOn) ruler.style.top = `${e.clientY - 21}px`;
    });
    document.getElementById("speakBtn").addEventListener("click", () => {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(simplifyText(inp.value).join(" "));
      u.rate = Number(document.getElementById("rate").value) || 0.92;
      window.speechSynthesis.speak(u);
    });
    document.getElementById("stopBtn").addEventListener("click", () => window.speechSynthesis?.cancel());
    document.getElementById("loadDense").addEventListener("click", () => {
      inp.value = "To facilitate equitable educational outcomes, institutions must utilize comprehensive accessibility methodology; subsequently, modifications to typography, luminance contrast, and lexical complexity demonstrate approximately sufficient reductions in cognitive load for neurodivergent learners.";
      render();
    });
    document.getElementById("exportStudy").addEventListener("click", () => {
      const r = analyzeReadability(inp.value);
      const md = `# AccessED Hub — Simplified Study Guide\n\n- Original FK Grade: ${r.fkGrade} (Reading Ease ${r.fleschEase}/100)\n\n## Chunked Reading Steps\n` +
        simplifyText(inp.value).map((s, i) => `${i + 1}. ${s}`).join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
      a.download = "accessed-study-guide.md";
      a.click();
    });

    inp.addEventListener("input", render);
    setTheme("", "#f8fafc", "#0b1120", "themeDark");
    render();
  </script>
</body>
</html>
