<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AccessED Hub — Adaptive Accessible Learning Studio</title>
  <style>
    :root { --bg: #0f172a; --fg: #f8fafc; --card: #1e293b; --accent: #38bdf8; }
    body.light { --bg: #fefce8; --fg: #1c1917; --card: #fef9c3; --accent: #0284c7; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); max-width: 820px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.7; transition: all .2s; }
    body.dyslexic { letter-spacing: 0.06em; word-spacing: 0.14em; line-height: 2.0; font-size: 1.12rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; }
    button { background: var(--accent); color: #0f172a; border: none; padding: 0.5rem 0.9rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    textarea { width: 100%; min-height: 130px; padding: 0.75rem; border-radius: 8px; background: var(--card); color: var(--fg); border: 1px solid #475569; font: inherit; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .metric { background: var(--card); padding: 0.75rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>AccessED Hub</h1>
  <p>Adaptive reading, high-contrast &amp; text-to-speech study companion removing barriers for learners.</p>
  <div class="controls">
    <button onclick="document.body.classList.toggle('dyslexic')">Toggle Dyslexia Spacing</button>
    <button onclick="document.body.classList.toggle('light')">Toggle Warm High-Contrast</button>
    <button onclick="speak()">Read Aloud (TTS)</button>
    <button onclick="window.speechSynthesis?.cancel()">Stop Audio</button>
  </div>
  <textarea id="input">Accessible education empowers every student to learn without barriers. Breaking long technical paragraphs into clear, readable steps helps learners with dyslexia, ADHD, and visual fatigue.</textarea>
  <div class="metrics" id="out"></div>
  <script type="module">
    import { analyzeReadability } from './access.mjs';
    const inp = document.getElementById('input');
    const out = document.getElementById('out');
    function render() {
      const r = analyzeReadability(inp.value);
      out.innerHTML = `
        <div class="metric"><strong>Level</strong><div>${r.level}</div></div>
        <div class="metric"><strong>Words</strong><div>${r.wordCount} (${r.readingMinutes} min)</div></div>
        <div class="metric"><strong>Avg Sentence</strong><div>${r.avgWordsPerSentence} words</div></div>
        <div class="metric"><strong>Complex Words</strong><div>${r.longWords}</div></div>`;
    }
    window.speak = () => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(inp.value);
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    };
    inp.addEventListener('input', render);
    render();
  </script>
</body>
</html>
